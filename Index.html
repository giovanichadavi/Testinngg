<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - SIM PTPN</title>
  <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon">
  <link href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
  <script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <style>
    .sidebar-active {
      background-color: rgba(0,0,0,0.1);
      border-left: 4px solid #16a34a;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div class="hidden md:flex md:flex-shrink-0">
      <div class="flex w-64 flex-col bg-green-800 text-white">
        <div class="flex h-16 items-center justify-center bg-green-900">
          <span class="text-xl font-bold">SIM PTPN</span>
        </div>
        <div class="flex flex-grow flex-col overflow-y-auto">
          <nav class="flex-1 space-y-1 px-2 py-4">
            <a class="sidebar-active flex items-center rounded-md px-4 py-2 text-white hover:bg-green-700" href="#">
              <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
            </a>
            <a class="flex items-center rounded-md px-4 py-2 text-white hover:bg-green-700" href="#">
              <i class="fa-solid fa-cloud mr-3"></i> Pemupukan
            </a>
            <a class="flex items-center rounded-md px-4 py-2 text-white hover:bg-green-700" href="#">
              <i class="fa-solid fa-spray-can-sparkles mr-3"></i> Penyemprotan
            </a>
            <a class="flex items-center rounded-md px-4 py-2 text-white hover:bg-green-700" href="#">
              <i class="fa-solid fa-tree mr-3"></i> Pembabatan
            </a>
            <a class="flex items-center rounded-md px-4 py-2 text-white hover:bg-green-700" href="#">
              <i class="fas fa-users mr-3"></i> User
            </a>
          </nav>
          <div class="border-t border-green-700 p-4">
            <p class="text-sm font-medium">Admin</p>
            <button class="text-xs text-green-300 hover:text-white">Logout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <header class="border-b bg-white shadow-md">
        <div class="flex h-16 items-center justify-between px-6">
          <div class="flex items-center">
            <button class="text-gray-500 focus:outline-none md:hidden" id="sidebarToggle">
              <i class="fas fa-bars"></i>
            </button>
            <h1 class="ml-4 text-xl font-bold text-gray-800">Dashboard</h1>
          </div>
          <div class="flex items-center space-x-4">
            <button class="relative text-gray-500 hover:text-gray-700 focus:outline-none">
              <i class="fas fa-bell"></i>
              <span class="absolute right-0 top-0 inline-block h-2 w-2 rounded-full bg-red-500"></span>
            </button>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto bg-gray-100 p-6">
        <section class="flex h-full items-center justify-center">
          <div class="w-fit rounded-lg bg-white p-4 space-y-8 shadow-lg hover:shadow-none">
            <h1 class="font-medium text-xl text-center">
              Sistem Informasi Manajemen - PT Perusahaan Nusantara IV Regional 5
            </h1>
            <img class="rounded-md border border-gray-200" src="dashboard.png" alt="Dashboard Poster">
          </div>
        </section>

        <div class="mt-10 text-center">
          <img src="header.jpg" class="mx-auto rounded-md shadow-lg" alt="Header Image">
          <p class="mt-4 text-gray-600 font-medium">
            Regional V Kalimantan - Kebun: 14 Unit | PKS: 9 Unit
          </p>
          <img src="logo.jpeg" class="w-24 mx-auto mt-4" alt="Logo PTPN4 Regional V">
        </div>
      </main>
    </div>
  </div>

  <script>
    const sidebarToggle = document.getElementById('sidebarToggle');
    sidebarToggle?.addEventListener('click', function() {
      alert('Sidebar mobile aktif di versi desktop akan muncul otomatis di mobile');
    });
  </script>
</body>
</html>
